<!-- MODELO DO CARTÃO DE LINK (og.jpg)
     Esta é a arte que aparece quando alguém cola o endereço do site no
     WhatsApp, no Instagram ou no Facebook. Ela não é uma página do site:
     mora em docs/, que o .htaccess devolve como 404 e que fica de fora de
     qualquer publicação.

     Para gerar o og.jpg de novo (trocar a foto, mudar a frase):
       1. edite este arquivo
       2. abra http://localhost:8099/docs/og-modelo.html com o site servido
       3. tire um print de 1200x630 e salve como og.jpg na raiz, qualidade 90
       4. suba o ?v= do og:image no <head> de todas as páginas, senão o
          WhatsApp continua mostrando a arte velha por semanas

     Medidas que não são chute: 1200x630 é o tamanho que o WhatsApp mostra
     grande. Acima de mais ou menos 600 KB ele desiste da prévia grande e
     mostra só um quadradinho, por isso o arquivo fica perto de 150 KB.
-->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" />

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#1C1F22}
  .cartao{
    position:relative;width:1200px;height:630px;overflow:hidden;
    display:grid;grid-template-columns:646px 554px;
    font-family:"Figtree",sans-serif;background:#1C1F22;
  }
  /* dois campos em vez de degradê por cima da foto: o logotipo ganha chão
     limpo e a vitrine acesa fica inteira, sem véu escurecendo o que ela tem
     de melhor, que é a luz */
  .lado{
    background:#1C1F22;color:#F2EDE3;
    display:flex;flex-direction:column;justify-content:center;
    padding-left:86px;padding-right:44px;
    position:relative;z-index:2;
  }
  .foto{
    border-left:3px solid #B8934A;
    /* fecha na vitrine acesa e deixa fora o poste, os fios e o letreiro da
       fachada, que competia com o logotipo do lado */
    background:url("/assets/img/vitrines-acesas.webp") -30px -800px / 1153px 1502px no-repeat;
    filter:saturate(1.12) contrast(1.08) brightness(1.04);
  }
  .laco{width:126px;color:#2E7FCE;display:block;margin-bottom:32px}
  .nome{width:404px;color:#F2EDE3;display:block}
  .risco{width:56px;height:1px;background:#B8934A;margin:32px 0 19px}
  .linha{
    font-size:18.5px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:600;color:#C3BCAE;line-height:1.62;
  }
  .linha b{color:#F2EDE3;font-weight:600}
</style></head>
